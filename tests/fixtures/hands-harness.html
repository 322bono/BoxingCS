<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body,
      #ring {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #171b1e;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="ring"></div>
    <script type="module">
      import { World } from "/src/world.ts";
      import { createBout } from "/shared/game.ts";
      const world = new World(document.querySelector("#ring"), () => {
        throw Error("WebGL context lost");
      });
      world.renderer.setAnimationLoop(null);
      world.reduced = true;
      world.shake = false;
      await world.setCharacters("nova", "nova");
      const bout = createBout(["a", "b"], ["nova", "nova"]);
      bout.countdown = 0;
      world.fight(bout, 0);
      const pose = (
        kind = "idle",
        character = "nova",
        phase = 0.5,
        view = 0,
      ) => {
        world.viewIndex = view;
        const state = bout.fighters[view];
        state.character = character;
        state.guard = kind === "guard";
        state.kind = kind === "idle" || kind === "guard" ? "jab" : kind;
        state.attack =
          kind === "idle" || kind === "guard"
            ? 0
            : (1 - phase) *
              (kind === "skill" ? 0.6 : kind === "hook" ? 0.34 : 0.2);
        const own = bout.fighters[view];
        world.camera.position.set(own.x, 1.9, own.z);
        world.fighters.forEach((model, i) => {
          const fighter = bout.fighters[i];
          model.position.set(fighter.x, 0.15, fighter.z);
        });
        world.render();
      };
      pose();
      window.handHarness = { world, bout, pose };
    </script>
  </body>
</html>
